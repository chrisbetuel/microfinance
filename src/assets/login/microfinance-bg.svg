<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Microfinance banking backdrop">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.45" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.12" cy="0.9" r="0.75">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d2fe" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#312e81" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#warm)"/>

  <!-- banking-district skyline -->
  <g opacity="0.9">
    <rect x="70"  y="560" width="120" height="440" fill="url(#tower)"/>
    <rect x="220" y="470" width="150" height="530" fill="url(#tower)"/>
    <rect x="400" y="620" width="110" height="380" fill="url(#tower)"/>
    <rect x="540" y="380" width="170" height="620" fill="url(#tower)"/>
    <rect x="740" y="540" width="130" height="460" fill="url(#tower)"/>
    <rect x="900" y="300" width="190" height="700" fill="url(#tower)"/>
    <rect x="1120" y="500" width="140" height="500" fill="url(#tower)"/>
    <rect x="1290" y="430" width="160" height="570" fill="url(#tower)"/>
    <rect x="1470" y="600" width="110" height="400" fill="url(#tower)"/>
  </g>
  <!-- lit windows -->
  <g fill="#a5b4fc" opacity="0.5">
    <rect x="255" y="500" width="14" height="14"/><rect x="285" y="500" width="14" height="14"/><rect x="315" y="530" width="14" height="14"/>
    <rect x="575" y="420" width="14" height="14"/><rect x="605" y="420" width="14" height="14"/><rect x="635" y="460" width="14" height="14"/><rect x="605" y="500" width="14" height="14"/>
    <rect x="935" y="340" width="16" height="16"/><rect x="970" y="340" width="16" height="16"/><rect x="1005" y="380" width="16" height="16"/><rect x="970" y="420" width="16" height="16"/><rect x="1040" y="420" width="16" height="16"/>
    <rect x="1325" y="470" width="14" height="14"/><rect x="1355" y="470" width="14" height="14"/><rect x="1385" y="510" width="14" height="14"/>
  </g>

  <!-- portfolio growth: bars + rising line -->
  <g transform="translate(120 640)" opacity="0.85">
    <rect x="0"   y="150" width="46" height="120" rx="6" fill="#818cf8" opacity="0.5"/>
    <rect x="70"  y="110" width="46" height="160" rx="6" fill="#818cf8" opacity="0.6"/>
    <rect x="140" y="70"  width="46" height="200" rx="6" fill="#a5b4fc" opacity="0.7"/>
    <rect x="210" y="30"  width="46" height="240" rx="6" fill="#c7d2fe" opacity="0.85"/>
    <polyline points="23,150 93,110 163,70 233,30 300,-8" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="300" cy="-8" r="9" fill="#34d399"/>
  </g>

  <!-- coins -->
  <g>
    <circle cx="1230" cy="210" r="54" fill="url(#coin)" opacity="0.92"/>
    <circle cx="1230" cy="210" r="54" fill="none" stroke="#b45309" stroke-opacity="0.35" stroke-width="3"/>
    <text x="1230" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#b45309" fill-opacity="0.65">$</text>

    <circle cx="1360" cy="330" r="34" fill="url(#coin)" opacity="0.8"/>
    <circle cx="1360" cy="330" r="34" fill="none" stroke="#b45309" stroke-opacity="0.3" stroke-width="2"/>

    <circle cx="1150" cy="330" r="24" fill="url(#coin)" opacity="0.7"/>

    <g transform="translate(1300 470)" opacity="0.85">
      <ellipse cx="0" cy="70" rx="60" ry="14" fill="#f59e0b" opacity="0.5"/>
      <rect x="-60" y="40" width="120" height="26" rx="13" fill="url(#coin)"/>
      <rect x="-60" y="16" width="120" height="26" rx="13" fill="url(#coin)" opacity="0.9"/>
      <rect x="-60" y="-8" width="120" height="26" rx="13" fill="url(#coin)" opacity="0.8"/>
    </g>
  </g>

  <!-- soft foreground fade -->
  <rect x="0" y="720" width="1600" height="280" fill="#0b1220" opacity="0.35"/>
</svg>
