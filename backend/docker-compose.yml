services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_dev_password
    ports:
      # Override the host port if 5432 is taken: DB_PORT=5433 docker compose up
      - "${DB_PORT:-5432}:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lms:lms_dev_password@db:5432/lms
      JWT_SECRET_KEY: dev-insecure-secret-change-me-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176"
      # SMS: console (prints) until a gateway is configured. For Haflaway set these in backend/.env:
      #   LMS_SMS_PROVIDER=haflaway  LMS_SMS_API_KEY=smtz_…  LMS_SMS_SENDER_ID=<approved id>  LMS_SMS_WEBHOOK_SECRET=whsec_…
      LMS_SMS_PROVIDER: "${LMS_SMS_PROVIDER:-console}"
      LMS_SMS_API_KEY: "${LMS_SMS_API_KEY:-}"
      LMS_SMS_SENDER_ID: "${LMS_SMS_SENDER_ID:-}"
      LMS_SMS_WEBHOOK_SECRET: "${LMS_SMS_WEBHOOK_SECRET:-}"
      LMS_SMS_ALLOWED_NUMBERS: "${LMS_SMS_ALLOWED_NUMBERS:-}"
      LMS_TIME_ZONE: "${LMS_TIME_ZONE:-Africa/Dar_es_Salaam}"
    ports:
      # Override the host port if 8000 is taken: API_PORT=8001 docker compose up
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             { python manage.py seed_demo || true; } &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  lms_pgdata:
